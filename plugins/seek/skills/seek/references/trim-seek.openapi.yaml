  /api/v1/asset/unpackZipFile:
    post:
      summary: 按真实格式解压素材压缩包
      tags:
        - asset
      description: >-
        按文件内容识别 ZIP、RAR、TAR、TAR.GZ/TGZ，与扩展名无关。
        在素材同级新建以压缩包文件名（不含压缩后缀）命名的目录，保留包内完整目录结构。
        目录冲突时自动追加编号，不覆盖已有文件。后台逐条解压、校验并入库，不进行完整试解压。
        password 可省略；同步最多读取前 64 KiB、检查 64 个条目，仅探测首个普通文件是否加密。
        在此范围内发现缺少密码时同步返回 101000014；前缀过长或后续文件加密时，通过后台任务报告。
        ZIP 中央目录在后台逐条读取，不加载完整索引；各格式不维护全包路径集合。
        仅核对解压输出大小，不做文件内容 CRC/认证摘要校验；保留路径安全及不覆盖写入，重复普通文件跳过，目录可复用。
        接口先检查目标目录写权限、完成输出目录重名避让和创建入库，再创建任务；ext.folderGuid 初始即有效。
        创建目录和任务前仅检查一次剩余可用空间，要求至少为压缩包实际大小的 1.5 倍；不足时接口同步报错。
        RAR 仅支持单卷，7Z 暂不支持。沿用原 ZIP 解压接口，入参和返回结构不变，所有格式的任务类型均为 ZipUnpack。
        101000014 表示需要密码，101000015 表示密码错误，101000016 表示压缩包损坏，
        101000017 表示不安全或冲突的条目路径，101000018 表示超过解压限制，
        101000019 表示不支持的压缩或加密方式，101000020 表示空包，101000021 表示解压任务繁忙。
        不设置条目数量、累计元数据、解压大小、压缩比或后台运行时长限制；仅保留格式、大小及安全落盘检查。
        成功返回 taskId；密码不正确、损坏数据、危险条目、空包、解压或入库失败通过任务错误报告。
        任务 Ext 包含 totalSize（压缩包实际字节数）和 processedSize（解压时已处理的压缩输入字节数）。
        processedSize 初始为 0，单文件内也会持续更新；成功结束后补齐 totalSize，失败或取消时保留实际处理量。
        前端用 ext.processedSize / ext.totalSize 显示进度，以 done、取消状态和错误信息判断成功完成。
        原任务 total 仍随条目发现而增长，仅用于条目统计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - versionGuid
              properties:
                versionGuid:
                  type: string
                password:
                  type: string
                  format: password
                  writeOnly: true
            example:
              versionGuid: '123'
              password: ''
      responses:
        '200':
          description: 业务结果，code 非成功值时 data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    nullable: true
                    properties:
                      taskId:
                        type: string
                required:
                  - code
                  - msg
                  - data
