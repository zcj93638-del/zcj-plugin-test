  /api/v1/sharelink/miniAppCode:
    post:
      summary: 生成分享链接的微信小程序码
      description: >-
        需要登录和项目权限，分享必须开放且未过期。scene 使用外链 ShareId；不包含访问密码或登录凭证。
        按分享加锁后读取已保存的图片，有图片则直接返回；字段为空时才请求 business-service 并保存。
        v0.0.7 增加 share_link.mini_app_code TEXT 字段，直接保存图片 Data URL，未生成时为空字符串。
        不设缓存键、有效期或配置变化后的自动刷新。详情接口通过 miniAppCode 返回已保存的图片，不触发生成。
      tags:
        - 外链
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guid]
              properties:
                guid:
                  type: string
      responses:
        '200':
          description: 统一业务响应；成功返回可展示和下载的小程序码 Data URL。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      imageDataUrl:
                        type: string
                        description: data:image/png;base64,... 或 data:image/jpeg;base64,...
