openapi: '3.1.0'
info:
  title: '素材库'
  description: ''
  version: 1.0.0
tags:
  - name: 登录
  - name: 用户管理
  - name: 播放器
  - name: 项目
  - name: 文件夹
  - name: asset
  - name: 任务
  - name: 回收站
  - name: 系统
  - name: 评论
  - name: ws
  - name: 外链
  - name: 通知
  - name: 分享页
  - name: 标签、状态管理
  - name: 预览管理
  - name: 维护工具
  - name: 云空间
security:
  - SeekToken: []
paths:
  /api/v1/auth/user/loginByPassword:
    post:
      summary: 密码登录
      deprecated: false
      description: ''
      tags:
        - 登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                deviceId:
                  type: string
              required:
                - username
                - password
                - deviceId
            example:
              username: zcj
              password: a12345
              deviceId: '69'
      responses:
        '200':
          description: 登录成功后通过 HttpOnly Cookie 写入 seek-token，响应体不返回 token。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - data
          headers:
            Set-Cookie:
              description: seek-token=<token>; Path=/; HttpOnly; SameSite=Strict
              schema:
                type: string
      security: []
  /api/v1/auth/user/loginByAuth:
    post:
      summary: 授权登录
      deprecated: false
      description: ''
      tags:
        - 登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: oauth生成nas验证的code
                deviceId:
                  type: string
                sourceType:
                  type: string
                  description: nas授权为"Trim-NAS"
              required:
                - code
                - sourceType
                - deviceId
            example:
              code: olq6I7zp-w
              deviceId: '79'
              sourceType: Trim-NAS
      responses:
        '200':
          description: 登录成功后通过 HttpOnly Cookie 写入 seek-token，响应体不返回 token。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - data
          headers:
            Set-Cookie:
              description: seek-token=<token>; Path=/; HttpOnly; SameSite=Strict
              schema:
                type: string
      security: []
  /api/v1/auth/user/logout:
    post:
      summary: 退出登陆
      deprecated: false
      description: ''
      tags:
        - 登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples: {}
      responses:
        '200':
          description: 退出登录成功后删除 seek-token Cookie。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - data
          headers:
            Set-Cookie:
              description: seek-token=; Max-Age=0; Path=/; HttpOnly; SameSite=Strict
              schema:
                type: string
  /api/v1/manager/user/create:
    post:
      summary: 管理员创建用户
      deprecated: false
      description: ''
      tags:
        - 用户管理
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                nickname:
                  type: string
                  description: 必填，1-32 个字符；去除首尾空格，不允许换行或控制字符
                avatar:
                  type: string
                  description: 可选；先调用头像上传接口获取标识，再在创建用户时提交
                password:
                  type: string
                role:
                  type: integer
                  description: '0: 普通用户， 1: 管理员， 2: 超级管理员'
                  title: 用户身份
              required:
                - username
                - nickname
                - password
                - role
            example:
              username: 佛美方6
              nickname: 佛美方
              password: w81FA5KzZlMRElF
              role: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/manager/user/list:
    get:
      summary: 管理员看用户列表
      deprecated: false
      description: ''
      tags:
        - 用户管理
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        guid:
                          type: string
                        username:
                          type: string
                        nickname:
                          type: string
                        avatar:
                          type: string
                          description: 空字符串表示使用昵称文字头像；非空时拼接头像读取路径
                        role:
                          type: integer
                          description: '0: 普通用户， 1: 管理员， 2: 超级管理员'
                        status:
                          type: integer
                          description: '0:正常 , 1: 禁用'
                        sourceName:
                          type: string
                          description: 关联的nas用户名
                        licenseLimited:
                          type: boolean
                          description: 是否受 license 限制无法登录
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/manager/user/update:
    post:
      summary: 管理更新用户
      deprecated: false
      description: ''
      tags:
        - 用户管理
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guid:
                  type: string
                nickname:
                  type: string
                  description: 1-32 个字符；去除首尾空格
                avatar:
                  type: string
                  description: 上传接口返回的头像标识；空字符串删除头像，不传则保持不变
                password:
                  type: string
                status:
                  type: integer
                  description: '0:正常 , 1: 禁用'
                role:
                  type: integer
                  description: '0: 普通用户， 1: 管理员， 2: 超级管理员'
              required:
                - guid
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/manager/user/delete:
    post:
      summary: 管理删除用户
      deprecated: false
      description: ''
      tags:
        - 用户管理
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guid:
                  type: string
              required:
                - guid
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/user/user/info:
    get:
      summary: 获取用户信息
      deprecated: false
      description: ''
      tags:
        - 用户管理
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      guid:
                        type: string
                      username:
                        type: string
                      nickname:
                        type: string
                      avatar:
                        type: string
                      role:
                        type: integer
                        description: '0:正常 , 1: 禁用'
                      status:
                        type: integer
                        description: '0: 普通用户， 1: 管理员， 2: 超级管理员'
                      sourceName:
                        type: string
                        description: 关联的nas用户名
                    required:
                      - guid
                      - username
                      - role
                      - status
                      - sourceName
                required:
                  - code
                  - msg
                  - data
              example:
                code: 0
                msg: ''
                data:
                  guid: 1df4ecff538946cdab588a56d809e796
                  username: anna
                  role: 2
                  status: 0
                  sourceName: anna
          headers: {}
  /api/v1/user/user/update:
    post:
      summary: 用户更新信息
      deprecated: false
      description: 修改密码成功后会重新写入 seek-token HttpOnly 会话 Cookie，响应体不返回 token。
      tags:
        - 用户管理
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                username:
                  type: string
                nickname:
                  type: string
                  description: 1-32 个字符；去除首尾空格
                avatar:
                  type: string
                  description: 上传接口返回的头像标识；空字符串删除头像，不传则保持不变
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /upload/api/v1/user/avatar:
    post:
      summary: 上传用户头像
      description: JPG、JPEG、PNG、WebP，最大 5 MB，至少 128 x 128 像素。上传只保存文件并返回 avatar 标识；系统初始化、创建或更新用户时提交该标识才生效。
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 返回 data.avatar
  /s/{shareId}/busapi/seek/api/v1/guest/info:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取外链访客资料
      description: name 为原有访客用户名，nickname 为独立昵称；avatar 为空时使用默认头像。
      security: []
      tags:
        - 分享页
      responses:
        '200':
          description: 返回访客资料，包含 name、nickname 和 avatar
  /s/{shareId}/busapi/seek/api/v1/guest/update:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 更新外链访客昵称和头像
      description: 需要有效的 asset-guest-token；name 和 nickname 分别更新用户名与昵称。avatar 提交上传接口返回的标识，空字符串删除头像，不传则保持不变。
      tags:
        - 分享页
      security:
        - GuestToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nickname:
                  type: string
                avatar:
                  type: string
      responses:
        '200':
          description: 返回更新后的访客资料
  /s/{shareId}/busapi/seek/api/v1/guest/avatar:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 上传外链访客头像
      description: 需要有效的 asset-guest-token；JPG、JPEG、PNG、WebP，最大 5 MB，至少 128 x 128 像素。只保存文件并返回 avatar 标识，访客资料更新时提交才生效。
      tags:
        - 分享页
      security:
        - GuestToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 返回 data.avatar
  /s/{shareId}/busapi/seek/api/v1/avatar/{ownerType}/{ownerGuid}/{avatar}:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 分享页读取用户或访客头像
      tags:
        - 分享页
      security: []
      parameters:
        - name: ownerType
          in: path
          required: true
          schema:
            type: string
            enum: [user, guest]
        - name: ownerGuid
          in: path
          required: true
          schema:
            type: string
        - name: avatar
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 图片内容
  /api/v1/avatar/{ownerType}/{ownerGuid}/{avatar}:
    get:
      summary: 内部页面读取用户或访客头像
      tags:
        - 用户管理
      parameters:
        - name: ownerType
          in: path
          required: true
          schema:
            type: string
            enum: [user, guest]
        - name: ownerGuid
          in: path
          required: true
          schema:
            type: string
        - name: avatar
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 图片内容
  /api/v1/manager/user/projects:
    get:
      summary: 用户项目列表
      deprecated: false
      description: ''
      tags:
        - 用户管理
      parameters:
        - name: userGuid
          in: query
          description: ''
          required: false
          example: f28875b054a740bb80e8b796d3e60a31
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - code
                  - msg
                  - data
              example:
                code: 0
                msg: ''
                data:
                  list:
                    - guid: 36e64ff5-0857-47e0-b53c-5f62104118d7
                      logoGuid: 576c0698-57f1-4aea-923a-a6aabbe072f4-png
                      name: 影视飓风
                      private: 0
                      size: 0
                      createdAt: 1756139809
                      permissionSource: public
                    - guid: c1fd5526-44b9-43f3-80c0-70efeed3dae3
                      logoGuid: 576c0698-57f1-4aea-923a-a6aabbe072f4-png
                      name: 测试预览小视频
                      private: 0
                      size: 0
                      createdAt: 1756141267
                      permissionSource: public
          headers: {}
  /api/v1/manager/user/unlock:
    post:
      summary: 管理解封用户
      deprecated: false
      description: ''
      tags:
        - 用户管理
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guid:
                  type: string
              required:
                - guid
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/player/genProxy:
    post:
      summary: 单个视频proxy 生成
      deprecated: false
      description: ''
      tags:
        - 播放器
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assetGuid:
                  type: string
                versionGuid:
                  type: string
                resolution:
                  type: string
                  title: 分辨率
                  description: 值为“获取视频播放信息”中的quality中的某个分辨率
                enableTaskx:
                  type: boolean
                  description: 是否加入任务面板
              required:
                - assetGuid
                - resolution
                - enableTaskx
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      reqId:
                        type: string
                    required:
                      - reqId
                required:
                  - code
                  - msg
                  - data
              example:
                code: 0
                msg: ''
                data:
                  reqId: f4f6ddfae4584075811ba3b74a8b8726
          headers: {}
  /api/v1/player/queryProxyStatus:
    get:
      summary: 查询视频proxy状况
      deprecated: false
      description: ''
      tags:
        - 播放器
      parameters:
        - name: assetGuid
          in: query
          description: ''
          required: true
          schema:
            type: string
        - name: versionGuid
          in: query
          description: ''
          required: false
          schema:
            type: string
        - name: resolution
          in: query
          description: ''
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        resolution:
                          type: string
                        percent:
                          type: integer
                        status:
                          type: string
                        taskId:
                          type: string
                      required:
                        - resolution
                        - percent
                        - status
                required:
                  - code
                  - msg
                  - data
              examples:
                '1':
                  summary: 成功示例
                  value:
                    code: 0
                    msg: ''
                    data:
                      reqId: f4f6ddfae4584075811ba3b74a8b8726
                '2':
                  summary: 成功示例
                  value:
                    code: 0
                    msg: ''
                    data:
                      - resolution: 4k
                        percent: 0
                        status: NotStarted
                      - resolution: '1080'
                        percent: 0
                        status: NotStarted
                      - resolution: '720'
                        taskId: 69009d54-3136-4737-a8d8-7d2557e865c9
                        percent: 8
                        status: Running
                      - resolution: '480'
                        percent: 0
                        status: NotStarted
                      - resolution: '360'
                        percent: 0
                        status: NotStarted
          headers: {}
  /api/v1/player/getTranscodeLink:
    post:
      summary: 生成实时转码链接
      deprecated: false
      description: ''
      tags:
        - 播放器
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assetGuid:
                  type: string
                versionGuid:
                  type: string
                playUuid:
                  type: string
                  description: 可选，用于关联并去重同一次播放的实时转码请求
                playSeq:
                  type: integer
                  format: uint64
                  description: 可选；传入 playUuid 时同时传入，并在每次请求时递增
                quality:
                  type: object
                  properties:
                    resolution:
                      type: string
                    bitrate:
                      type: string
                      description: 传 0 则自动选择适合的
                  required:
                    - resolution
                    - bitrate
                videoEncoder:
                  type: string
                  title: 视频编码器
                  description: 可选， h264、hevc
                audioEncoder:
                  type: string
                  title: 音频编码器
                  description: 可选， eac3、ac3、aac
                startTimestamp:
                  type: integer
                  description: 单位秒，表示从哪个时间点开始转码。
                channels:
                  type: string
                  description: 传-1 则选择原音频流的通道数
                forcedSDR:
                  type: boolean
                  description: 可选，是否强制输出 SDR；不传时使用媒体服务当前默认值
                keyFrameInterval:
                  type: integer
                  description: 可选，关键帧间隔；不传时使用媒体服务当前默认值
                audioIndex:
                  type: integer
                  default: -2
                  description: 可选，音频流索引；不传时使用 -2
                videoIndex:
                  type: integer
                  default: -1
                  description: 可选，视频流索引；不传时使用 -1
              required:
                - assetGuid
                - quality
                - channels
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      assetGuid:
                        type: string
                      hlsTime:
                        type: integer
                      isSubtitleExternal:
                        type: integer
                      playLink:
                        type: string
                      nonFatalErrno:
                        type: 'null'
                      videoEncoder:
                        type: string
                      notSupportedResolution:
                        type: string
                      supportedHighestResolution:
                        type: string
                    required:
                      - assetGuid
                      - hlsTime
                      - isSubtitleExternal
                      - playLink
                      - nonFatalErrno
                      - videoEncoder
                      - notSupportedResolution
                      - supportedHighestResolution
                required:
                  - code
                  - msg
                  - data
              example:
                code: 0
                msg: ''
                data:
                  assetGuid: ''
                  hlsTime: 4
                  isSubtitleExternal: 0
                  playLink: /f/media/7031d6da7dc4cfa574b09e3634c72410/preset.m3u8
                  nonFatalErrno: null
                  videoEncoder: ''
                  notSupportedResolution: ''
                  supportedHighestResolution: ''
          headers: {}
  /api/v1/player/getTranscodeStatis:
    post:
      summary: 获取实时转码统计信息
      deprecated: false
      description: ''
      tags:
        - 播放器
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetGuid:
                  type: string
                versionGuid:
                  type: string
                playLink:
                  type: string
                  description: getTranscodeLink 返回的实时转码播放链接
              required:
                - assetGuid
                - playLink
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
