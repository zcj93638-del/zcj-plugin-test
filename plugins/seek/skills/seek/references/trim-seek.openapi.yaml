  /api/v1/asset/cover/{assetVersionGuid}:
    get:
      summary: 获取文件封面
      deprecated: false
      description: 获取指定素材版本的自定义封面。素材无封面、无访问权限或封面文件不存在时返回 404。
      tags:
        - asset
      parameters:
        - name: assetVersionGuid
          in: path
          description: 素材版本guid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JPEG 封面文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers: {}
        '404':
          description: 素材、封面文件不存在或无访问权限
