  /api/v1/cloudSpace/detail:
    get:
      summary: 查询云空间详情
      deprecated: false
      description: 查询当前设备对应的飞牛账号、云空间配额和云缓存设置。配额单位为字节；尚未保存设置时返回 enable=false、autoCleanupDays=30。环境不可用或 license 无权限时不请求云空间服务，配额返回 0。云空间账号和网络状态通过系统 config 接口返回。
      tags:
        - 云空间
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      account:
                        type: string
                        description: 当前 NAS 绑定的飞牛账号，未绑定时为空字符串。
                      usage:
                        type: object
                        properties:
                          quotaBytes:
                            type: integer
                            format: int64
                          usedBytes:
                            type: integer
                            format: int64
                        required:
                          - quotaBytes
                          - usedBytes
                      setting:
                        type: object
                        properties:
                          enable:
                            type: boolean
                          autoCleanupDays:
                            type: integer
                            enum:
                              - -1
                              - 7
                              - 30
                            description: 云缓存自动清理天数；-1 表示永不清理。
                        required:
                          - enable
                          - autoCleanupDays
                    required:
                      - account
                      - usage
                      - setting
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/cloudSpace/list:
    get:
      summary: 查询云空间文件列表
      deprecated: false
      description: 仅管理员可访问。查询本地 fs_entry_cloud 记录，不请求云空间服务；列表数据可能包含云端已不存在的缓存记录。
      tags:
        - 云空间
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            guid:
                              type: string
                            versionGuid:
                              type: string
                            fileName:
                              type: string
                              description: 本地资产文件名；本地资产不存在时为空字符串。
                            fileSize:
                              type: integer
                              format: int64
                              description: 本地资产文件大小，单位为字节；本地资产不存在时为 0。
                            coverVersion:
                              type: string
                              description: 本地资产的封面版本；本地资产不存在或尚未生成封面时为空字符串。
                            project:
                              type: object
                              nullable: true
                              description: 本地资产所属项目；本地资产或项目不存在时为 null。
                              properties:
                                guid:
                                  type: string
                                name:
                                  type: string
                              required:
                                - guid
                                - name
                            status:
                              type: string
                              enum:
                                - normal
                                - pending_cleanup
                              description: normal 表示资产仍被普通外链直接或通过文件夹引用；pending_cleanup 表示未被外链引用或本地资产已不存在。
                            resolution:
                              type: string
                              description: 云端缓存文件的分辨率；水印缓存使用水印设置中的分辨率，不再使用 0 占位。
                            watermarkTime:
                              type: integer
                              format: int64
                            createdAt:
                              type: integer
                              format: int64
                            updatedAt:
                              type: integer
                              format: int64
                          required:
                            - guid
                            - versionGuid
                            - fileName
                            - fileSize
                            - coverVersion
                            - project
                            - status
                            - resolution
                            - createdAt
                            - updatedAt
                    required:
                      - files
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/cloudSpace/deleteFiles:
    post:
      summary: 批量删除云空间文件
      deprecated: false
      description: 仅管理员可访问。根据云空间文件列表返回的 guid 数组批量删除对应云端缓存；云端删除成功后同步删除本地 fs_entry_cloud 记录。请求中的记录已不存在时静默跳过；存在记录需要请求云端但发生网络异常时返回 100000020。
      tags:
        - 云空间
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: 云空间文件列表返回的文件 guid 数组。
              required:
                - guids
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - data
          headers: {}
webhooks: {}
components:
  parameters:
    StatusScope:
      name: scope
      in: query
      required: false
      description: 省略或传 asset 为资产状态；project 为项目状态
      schema:
        type: string
        enum: [asset, project]
        default: asset
  securitySchemes:
    SeekToken:
      type: apiKey
      in: cookie
      name: seek-token
    GuestToken:
      type: apiKey
      in: cookie
      name: asset-guest-token
  schemas:
    Project:
      type: object
      properties:
        guid:
          type: string
          description: ' 项目id'
        status:
          type: object
          description: 项目状态；无状态时不返回
          properties:
            guid:
              type: string
            name:
              type: string
            color:
              type: string
            emoji:
              type: string
            order:
              type: integer
            createdAt:
              type: integer
        logoGuid:
          type: string
          description: logo id
        name:
          type: string
          description: 名称
        private:
          type: integer
          description: 是否私有，1：是，0：否
        size:
          type: integer
          description: 大小，单位KB
        createdAt:
          type: integer
          description: 创建时间戳，单位秒
        permissionSource:
          type: string
          description: 权限来源：public, admin, member
        proxyFileSize:
          type: integer
          description: 代理文件大小，单位KB
        deleteTaskId:
          type: string
          description: 删除任务的id
        importTaskId:
          type: string
          description: 示例项目导入任务的id
        scanStatus:
          type: object
          properties:
            running:
              type: boolean
              description: 是否运行中
            time:
              type: integer
              description: 执行时间
          required:
            - running
            - time
          description: 扫描状态
      required:
        - guid
        - logoGuid
        - name
        - private
        - size
        - createdAt
        - permissionSource
        - deleteTaskId
        - importTaskId
    ProjectStatus:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
        color:
          type: string
        emoji:
          type: string
        order:
          type: integer
        projectCount:
          type: integer
        canDelete:
          type: boolean
        createdAt:
          type: integer
      required: [guid, name, color, emoji, order, projectCount, canDelete, createdAt]
    FileAsset:
      type: object
      properties:
        guid:
          type: string
          description: asset guid
        versionGuid:
          type: string
          description: 版本guid
        version:
          type: integer
          description: 版本号
        path:
          description: 文件路径
          type: string
        name:
          description: 文件名
          type: string
        modTime:
          description: 修改时间
          type: integer
        size:
          type: integer
        type:
          description: 类型， 1：视频， 2：音频，3：图片
          type: integer
        thumbStatus:
          description: '缩略图状态，1: 成功,-1:失败,2:进行中'
          type: integer
        prepareStatus:
          description: '准备状态，1: 成功,-1:失败,2:进行中'
          type: integer
        width:
          description: 宽度
          type: integer
        height:
          description: 高度
          type: integer
        trashedTime:
          type: integer
          description: 进入回收站时间
        statusx:
          type: string
          description: >-
            N个个位整数组成在字符串，第1位:
            meta状态，第2位：缩略图状态，第3位：雪碧图状态，第4位：预览视频状态，第5位：预处理状态。状态值枚举：0：失败，1：不需要处理，2：成功，3：等待中
        versions:
          type: array
          items:
            type: object
            properties:
              guid:
                type: string
                description: 版本guid
              name:
                type: string
                description: 文件名
              version:
                type: string
                description: 版本号
              statusx:
                type: string
                description: >-
                  N个个位整数组成在字符串，第1位:
                  meta状态，第2位：缩略图状态，第3位：雪碧图状态，第4位：预览视频状态，第5位：预处理状态。状态值枚举：0：失败，1：不需要处理，2：成功，3：等待中
            required:
              - guid
              - name
              - version
              - statusx
        creator:
          $ref: '#/components/schemas/User'
        createdAt:
          type: integer
          description: 创建时间
        coverVersion:
          type: string
          description: 自定义封面版本；空字符串表示未设置封面，可用于封面请求的缓存刷新
      required:
        - guid
        - name
        - modTime
        - size
        - type
        - versionGuid
        - version
        - versions
        - statusx
        - coverVersion
    FolderAsset:
      type: object
      properties:
        guid:
          type: string
        path:
          description: 路径
          type: string
        name:
          description: 文件名
          type: string
        modTime:
          description: 修改时间
          type: integer
        fileCount:
          type: integer
          description: 文件数量
        trashedTime:
          type: integer
          description: 进入回收站时间
        createdAt:
          type: integer
          description: 创建时间
        creator:
          $ref: '#/components/schemas/User'
          description: 创建人
        scanStatus:
          type: object
          properties:
            running:
              type: boolean
              description: 是否运行中
            time:
              type: string
              description: 执行时间
          description: 扫描状态
          required:
            - running
            - time
      required:
        - guid
        - name
        - modTime
        - fileCount
    AssetMoveReq:
      type: object
      properties:
        source:
          type: object
          properties:
            guids:
              type: array
              items:
                type: string
              description: 被移动的asset的guid
          required:
            - guids
        target:
          type: object
          properties:
            projectGuid:
              type: string
              description: 目标项目guid
            folderGuid:
              type: string
              description: 目标folder的guid，如果是project根目录填空串""
          required:
            - projectGuid
            - folderGuid
          description: 移动到哪里
        onNameConflict:
          type: string
          description: 同名文件处理：skip, keepBoth, overwrite
        fromSearch:
          type: boolean
          description: 是否由搜索场景触发，true 时同步刷新搜索索引
      required:
        - source
        - target
        - onNameConflict
    AssetCopyReq:
      type: object
      properties:
        source:
          type: object
          properties:
            guids:
              type: array
              items:
                type: string
              description: 被复制的asset的guid
          required:
            - guids
        target:
          type: object
          properties:
            projectGuid:
              type: string
              description: 目标项目guid
            folderGuid:
              type: string
              description: 目标folder的guid，如果是project根目录填空串""
          required:
            - projectGuid
            - folderGuid
          description: 复制到哪里
        onNameConflict:
          type: string
          description: 同名文件处理：skip, keepBoth, overwrite
      required:
        - source
        - target
        - onNameConflict
    User:
      type: object
      properties:
        guid:
          type: string
        username:
          type: string
        role:
          type: integer
          description: 0：普通角色，1：管理员，2：超级管理员
        status:
          type: integer
          description: 0：激活，1：禁用
      required:
        - guid
        - username
        - role
        - status
    Task:
      type: object
      properties:
        id:
          type: string
          description: 任务id
        type:
          type: string
          description: >-
            任务类型,MediaPrepare: 文件预处理，GenerateProxyVideo：生成proxy文件，BatchCopyFile:
            复制，BatchMoveFile：移动
        name:
          type: string
          description: 任务名称
        total:
          type: integer
          description: 分母
        successCount:
          type: integer
          description: 成功数量
        failCount:
          type: integer
          description: 失败数量
        done:
          type: boolean
          description: 是否已完成
        cancelling:
          type: boolean
          description: 是否取消中
        canceled:
          type: boolean
          description: 是否已取消
        canceledCount:
          type: integer
          description: 取消数量
        createdAt:
          type: integer
          description: 创建时间
        doneAt:
          type: integer
          description: 完成时间
        errStats:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
                description: 错误码
              msg:
                type: string
                description: 错误信息
              count:
                type: integer
                description: 此错误的数量
            required:
              - code
              - msg
              - count
          description: 错误统计列表
        errs:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
                description: 错误码
              msg:
                type: string
                description: 错误信息
              name:
                type: string
                description: item名称
              ext1:
                type: string
                description: 扩展字段1
              ext2:
                type: string
                description: 扩展字段2
              ext3:
                type: string
                description: 扩展字段3
            required:
              - code
              - ext3
              - ext2
              - ext1
              - msg
