      deprecated: false
      description: ''
      tags:
        - 系统
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                name:
                  type: string
              required:
                - path
                - name
            example:
              path: /vol2/1000/NAS硬件竞品图片
              name: 新建文件夹1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
          headers: {}
  /api/v1/sys/getTranscodeInfo:
    get:
      summary: 获取转码信息
      deprecated: false
      description: ''
      tags:
        - 系统
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      gpuEnable:
                        type: boolean
                      gpuSequence:
                        type: integer
                      gpuList:
                        type: array
                        items:
                          type: object
                          properties:
                            sequence:
                              type: integer
                            model:
                              type: string
                      cpuAllowDecoding:
                        type: boolean
                      mediasrvCacheDir:
                        type: string
                      mediasrvCacheVolIndex:
                        type: integer
                    required:
                      - gpuEnable
                      - gpuSequence
                      - gpuList
                      - cpuAllowDecoding
                      - mediasrvCacheDir
                      - mediasrvCacheVolIndex
                required:
                  - code
                  - msg
                  - data
              examples:
                '1':
                  summary: 成功示例
                  value:
                    code: 0
                    msg: ''
                    data:
                      gpu_acc: 0
                      gpu_prefer: 0
                      cpu_allow_decoding: 1
                      mediasrv_cache_dir: ''
                      mediasrv_cache_vol_index: 0
                '2':
                  summary: 成功示例
                  value:
                    code: 0
                    msg: ''
                    data:
                      gpuEnable: true
                      gpuSequence: 1
                      cpuAllowDecoding: 1
                      mediasrvCacheDir: ''
                      mediasrvCacheVolIndex: 0
                '3':
                  summary: 成功示例
                  value:
                    code: 0
                    msg: ''
                    data:
                      gpuEnable: true
                      gpuSequence: 1
                      gpuList:
                        - sequence: 1
                          model: NVIDIA GeForce GTX 1650
                      cpuAllowDecoding: true
                      mediasrvCacheDir: /vol1/@appmeta/trim.media/mediasrv.transcode
                      mediasrvCacheVolIndex: 1
          headers: {}
  /api/v1/sys/updateTranscodeInfo:
    post:
      summary: 修改转码信息
      deprecated: false
      description: ''
      tags:
        - 系统
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gpuEnable:
                  type: boolean
                  description: 0=关闭, 1=开启
                gpuSequence:
                  type: integer
                  description: GPU偏好序列
                cpuAllowDecoding:
                  type: boolean
                mediasrvCacheVolIndex:
                  type: integer
                  description: 转码缓存文件存放index
              required:
                - gpuEnable
                - gpuSequence
                - cpuAllowDecoding
                - mediasrvCacheVolIndex
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - data
